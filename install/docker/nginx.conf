# Process GPT Lite gateway: the SPA plus every path the Vite dev server proxied, and the
# Supabase API on the same origin (one public URL for the browser and the services).
# A template (nginx image envsubst at start): the upstreams and the DNS resolver differ between the
# Compose install (defaults in pgpt.Dockerfile) and Kubernetes (process-gpt-k8s sets them).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# the desktop app's local agents fetch and push their work folders on /api/local-git/ (below): a few requests a minute per address
limit_req_zone $binary_remote_addr zone=lite_local_git:10m rate=60r/m;

# Link previews (2026-11-24): index.html's og:/twitter: addresses are absolute, written at build with
# ${LITE_PUBLIC_ORIGIN} (vite.config.js pageMeta). A request that names its public host — X-Forwarded-Host, or a
# Host with a domain or localhost (a Compose install's own address) — gets its own origin there instead.
# Behind the ProcessGPT gateway neither arrives today (Host is the Service name, process-gpt-lite-web), so
# every company's page keeps the build's address: the same picture and words, served from the main address.
# Only host characters pass (the value lands in HTML attributes).
map $http_x_forwarded_host $pgl_fwd_host {
  "~^\s*([A-Za-z0-9.-]+(:[0-9]+)?)\s*(,|$)" $1;
  default "";
}
map $http_host $pgl_own_host {
  "~\.(svc|local|internal)(\.|:|$)" "";
  "~^(localhost(:[0-9]+)?)$" $1;
  "~^([A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(:[0-9]+)?)$" $1;
  default "";
}
map $pgl_fwd_host $pgl_host {
  "" $pgl_own_host;
  default $pgl_fwd_host;
}
map $http_x_forwarded_proto $pgl_proto {
  "~^\s*(https?)\s*(,|$)" $1;
  default $scheme;
}
map $pgl_host $pgl_origin {
  "" "${LITE_PUBLIC_ORIGIN}";
  default "$pgl_proto://$pgl_host";
}

# A file storage hands out on this origin (a public object: an agent's .html, an uploaded .svg …) is a page of its own when opened by
# itself: it may draw, never run script with this origin's sign-in. The same header the BFF puts on the files it serves (server routes
# folders.js · team.js · mailAttachments.js). Only storage's HTML · SVG · XML answers; a picture in <img>, a PDF, a video are untouched.
map "$uri|$upstream_http_content_type" $pgl_storage_csp {
  "~*^/storage/v1/[^|]*\|\s*(text/html|application/xhtml\+xml|image/svg\+xml|text/xml|application/xml)" "sandbox; default-src 'none'; img-src data:; style-src 'unsafe-inline'";
  default "";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 100m;
  root /usr/share/nginx/html;

  # resolve upstreams per request: optional services may not be running
  resolver ${LITE_RESOLVER} valid=10s ipv6=off;
  set $server     ${LITE_SERVER};
  set $officehost ${LITE_OFFICE_HOST};
  set $kong       ${LITE_KONG};

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # BFF: REST, SSE event stream, workroom terminal and craft live websockets
  location /api/ {
    proxy_pass http://$server;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  # schedule callbacks: pg_cron calls the BFF directly (PRO_CRON_CALLBACK), never from a browser
  location /api/cron/ {
    return 404;
  }
  # shared folders over git (server/lib/folders/gitHttp.js): agents in the cluster call the BFF directly
  # (PRO_GIT_URL = the Service address), never through the public address
  location /api/git/ {
    return 404;
  }
  # …except a linked desktop's local agent (docs/local-agents/design.md §8): the same git, its own path, where the BFF takes only a token it
  # minted for one job on one linked desktop (scope 'device' — not revoked, the job is that device's; reads that job's folders, pushes only
  # to the job's pgpt-agent/local-<job>-… branches), rate limited here and per device in the BFF. Pushes up to the folder upload limit.
  location /api/local-git/ {
    limit_req zone=lite_local_git burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 200m;
    proxy_pass http://$server;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
  # ArtCraft web apps (served by the BFF when installed)
  location /craft/ {
    proxy_pass http://$server;
  }
  # IeumOffice editors (page, __ipc websocket, document bytes)
  location /office/ {
    proxy_pass http://$officehost;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  # Supabase API (auth, PostgREST, storage) through Kong
  location ~ ^/(auth|rest|storage)/v1/ {
    proxy_pass http://$kong;
    proxy_read_timeout 300s;
    # (empty for everything but storage's HTML · SVG · XML: then no header at all)
    add_header Content-Security-Policy $pgl_storage_csp always;
  }
  # sign-in mail template GoTrue fetches (static, nothing secret)
  location /_lite/ {
    try_files $uri =404;
  }

  # 다른 앱의 「공유」(manifest share_target → POST <app>/share-target): the service worker answers it in the browser (public/sw.js).
  # One that reaches here — the worker not there (yet) — goes back to the app, which says it did not come. A relative address
  # (no leading /), so the gateway's /lite stays in front.
  location = /share-target {
    return 303 chat?share=failed;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    # the app is a page of its own: framed only by this origin (ProcessGPT's own pages on the same company address), no plug-in objects,
    # no <base> (the same two in index.html's meta; frame-ancestors works only as a header). Scripts are not limited here: a panel app
    # (src/components/PanelFrame.vue) runs its own inline script in a sandboxed srcdoc frame, which takes this page's policy.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'";
    # (index.html only: text/html is sub_filter's default type)
    sub_filter "${LITE_PUBLIC_ORIGIN}/" "$pgl_origin/";
    sub_filter_once off;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
