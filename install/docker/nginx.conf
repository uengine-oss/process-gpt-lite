# Process GPT Lite gateway: the SPA plus every path the Vite dev server proxied, and the
# Supabase API on the same origin (one public URL for the browser and the services).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 100m;
  root /usr/share/nginx/html;

  # resolve upstreams per request: optional services may not be running
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $server     server:8787;
  set $officehost office-host:5390;
  set $kong       kong:8000;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # BFF: REST, SSE event stream, workroom terminal and craft live websockets
  location /api/ {
    proxy_pass http://$server;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  # ArtCraft web apps (served by the BFF when installed)
  location /craft/ {
    proxy_pass http://$server;
  }
  # IeumOffice editors (page, __ipc websocket, document bytes)
  location /office/ {
    proxy_pass http://$officehost;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  # Supabase API (auth, PostgREST, storage) through Kong
  location ~ ^/(auth|rest|storage)/v1/ {
    proxy_pass http://$kong;
    proxy_read_timeout 300s;
  }
  # sign-in mail template GoTrue fetches (static, nothing secret)
  location /_lite/ {
    try_files $uri =404;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
