name: process-gpt-lite-office-host-image

# The IeumOffice editor (backends/office-host, its own unchanged Dockerfile) →
# ghcr.io/uengine-oss/process-gpt-lite-office-host:<office-host commit>, and that tag into
# process-gpt-k8s deployments/process-gpt-lite.yaml (the web nginx sends /lite/office/* to it).
# Built when the submodule moves; the tag follows the editor's commit, not this repository's.
on:
  push:
    branches:
      - main
    paths:
      - backends/office-host
      - .github/workflows/office-host-image.yml
  workflow_dispatch:

jobs:
  build-office-host:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # only the editor and its IeumOffice fork (backends/process-gpt is not needed here)
      - name: Checkout office-host and IeumOffice
        run: |
          git submodule update --init backends/office-host
          git -C backends/office-host submodule update --init --depth 1 ieumoffice \
            || git -C backends/office-host submodule update --init ieumoffice
          echo "IMAGE_TAG=$(git -C backends/office-host rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      # the Rust sidecar and the IeumOffice npm workspace need several GB of scratch space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push office-host image
        uses: docker/build-push-action@v6
        with:
          context: backends/office-host
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/uengine-oss/process-gpt-lite-office-host:${{ env.IMAGE_TAG }}
            ghcr.io/uengine-oss/process-gpt-lite-office-host:latest

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: uengine-oss/process-gpt-k8s
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update the image tag in GitOps repository
        run: |
          cd gitops-repo
          IMAGE=ghcr.io/uengine-oss/process-gpt-lite-office-host:$IMAGE_TAG
          yq eval -i '
            (select(.kind == "Deployment" and .metadata.name == "process-gpt-lite-office-host") | .spec.template.spec.containers[0].image) = "'$IMAGE'"
          ' deployments/process-gpt-lite.yaml
          grep -n "image:" deployments/process-gpt-lite.yaml

      # the app workflow may push to the same repository at the same time
      - name: Commit and push changes
        run: |
          cd gitops-repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update process-gpt-lite office-host image to $IMAGE_TAG" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - name: Create summary
        run: |
          echo "## IeumOffice editor image" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/uengine-oss/process-gpt-lite-office-host:${{ env.IMAGE_TAG }}\` (also \`latest\`)" >> $GITHUB_STEP_SUMMARY
          echo "A new package is private: make it public once (Package settings → Change visibility), the cluster pulls without a secret." >> $GITHUB_STEP_SUMMARY
