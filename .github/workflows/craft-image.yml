name: process-gpt-lite-craft-image

# The ArtCraft apps (install/docker/craft.Dockerfile) → ghcr.io/uengine-oss/process-gpt-lite-craft,
# which `./install.sh --with-craft` pulls instead of building them (~50 min, 12 GB+ memory).
on:
  push:
    branches:
      - main
    paths:
      - artcraft/**
      - install/docker/craft.Dockerfile
      - install/docker/craft-build.sh
      - .github/workflows/craft-image.yml
  workflow_dispatch:

jobs:
  build-craft:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # the build needs ~13 GB of scratch space; the runner starts with about that much free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Compute image tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push craft image
        uses: docker/build-push-action@v6
        with:
          context: artcraft
          file: install/docker/craft.Dockerfile
          build-contexts: install-docker=install/docker
          build-args: CRAFT_JOBS=2
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/uengine-oss/process-gpt-lite-craft:${{ env.IMAGE_TAG }}
            ghcr.io/uengine-oss/process-gpt-lite-craft:latest

      - name: Create summary
        run: |
          echo "## ArtCraft image" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/uengine-oss/process-gpt-lite-craft:${{ env.IMAGE_TAG }}\` (also \`latest\`)" >> $GITHUB_STEP_SUMMARY
